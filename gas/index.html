async function poll(){clearTimeout(GAS.t);if(GAS.busy)return;GAS.busy=true;

function auDesc(p,d){const c=p.split('/')[0];try{return c=='d_tx'?(d.type=='in'?'Pendapatan ':'Pengeluaran ')+d.cat+' '+rp(d.amt)+' ('+d.date+')':c=='d_sl'?d.name+' '+d.month+' '+rp(net(d))+(d.paid?' (lunas)':''):c=='d_e'?d.name:c=='d_iv'?d.name+' modal '+rp(d.cap):c=='d_ad'?rp(d.amt)+' '+(d.note||''):c=='d_ks'?rp(d.amt)+' '+({take:'diambil',keep:'masuk kas',sal:'diambil dari kas'}[d.kind||(d.take?'take':'keep')]):c=='d_u'?d.u:c=='d_rl'?d.name:c=='d_rc'?d.cat+' '+rp(d.amt):c=='d_cfg'?(p=='d_cfg/shop'?'Profil toko':'Kategori, keamanan, atau kunci bulan'):p.split('/')[1]}catch(e){return p}}
function auditDiff(){if(!U)return;const m=cur(),ev=[],skip=p=>!AU[p.split('/')[0]]||p=='d_cfg/log'||p=='d_cfg/theme';
Object.keys(m).forEach(p=>{if(skip(p))return;if(DB.last[p]!==JSON.stringify(m[p]))ev.push({k:DB.last[p]==null?'Tambah':'Ubah',p,d:m[p]})});
Object.keys(DB.last).forEach(p=>{if(skip(p))return;if(!(p in m)&&DB.last[p])ev.push({k:'Hapus',p,d:JSON.parse(DB.last[p])})});
if(!ev.length)return;const g={},t=new Date().toISOString().slice(0,16).replace('T',' ');ev.forEach(e=>{const k=e.k+'|'+e.p.split('/')[0];(g[k]=g[k]||[]).push(e)});
Object.keys(g).forEach(k=>{const a=g[k],kk=k.split('|')[0],c=k.split('|')[1];if(a.length>3)S.audit.push({id:uid(),t,u:U.u,a:kk,m:AU[c],d:a.length+' catatan'});else a.forEach(e=>S.audit.push({id:uid(),t,u:U.u,a:kk,m:AU[c],d:auDesc(e.p,e.d)}))});
if(S.audit.length>600){S.audit.sort((a,b)=>(a._o||0)-(b._o||0));S.audit=S.audit.slice(-500)}}
const lk=m=>{if(S.locks&&S.locks[m]){toast('Bulan '+bln(m)+' sudah ditutup. Buka kunci di menu Riwayat untuk mengubah.');return true}return false};
function lockM(m,on){if(!ed())return;ask(on?'Tutup buku bulan '+bln(m)+'? Data pembukuan dan slip gaji bulan ini tidak bisa diubah sampai kunci dibuka.':'Buka kunci bulan '+bln(m)+'?',()=>{S.locks=S.locks||{};if(on)S.locks[m]=true;else delete S.locks[m]})}
function delTx(id){const t=S.tx.find(x=>x.id==id);if(!t||lk(t.date.slice(0,7)))return;ask('Hapus data ini?',()=>{S.tx=S.tx.filter(x=>x.id!=id)})}
function delSlipQ(id){const s=S.slips.find(x=>x.id==id);if(!s||lk(s.month))return;ask('Hapus slip?',()=>delSlip(id))}
function bulkSlips(){if(!ed()||lk(M))return;const todo=S.emp.filter(e=>e.active&&!S.slips.some(s=>s.empId==e.id&&s.month==M));if(!todo.length)return toast('Semua karyawan aktif sudah punya slip bulan ini');ask('Buat slip gaji '+bln(M)+' untuk '+todo.length+' karyawan ('+todo.map(e=>esc(e.name)).join(', ')+')?',()=>{todo.forEach(e=>S.slips.push({id:uid(),empId:e.id,name:e.name,pos:e.pos,month:M,base:e.base,bonus:0,ded:0,note:'',paid:false,pd:''}))})}
function payAll(){if(!ed()||lk(M))return;const u=S.slips.filter(s=>s.month==M&&!s.paid);if(!u.length)return toast('Tidak ada slip yang belum dibayar');const tot=u.reduce((a,s)=>a+net(s),0);modal(`<h3>Bayar Semua Gaji</h3><p style="font-size:16px"><b>${u.length}</b> slip dengan total <b>${rp(tot)}</b> dibayar lunas untuk bulan <b>${bln(M)}</b>?</p><div class=yn><button class=btn id=yes>Ya</button><button class="btn g" id=no>Tidak</button></div>`);$('#no').onclick=closeM;$('#yes').onclick=()=>{closeM();u.forEach(s=>{s.paid=true;s.pd=autoDate(s.month);sync(s)});save();R();toast('Semua gaji lunas')}}
function recM(){modal(`<h3>Transaksi Berulang</h3><p class=mu>Template yang diterapkan tiap bulan (sewa, listrik, dll).</p>${S.rec.map(r=>`<div class=r><span>${r.type=='in'?'Masuk':'Keluar'} - ${esc(r.cat)} ${rp(r.amt)} ${esc(r.note||'')}</span><span>${ed()?`<button class="btn s g" onclick="recF('${r.id}')">Ubah</button><button class="btn s r" onclick="recD('${r.id}')">Hapus</button>`:''}</span></div>`).join('')||'<small>Belum ada template</small>'}<div class=row style="margin-top:10px">${ed()?'<button class=btn onclick="recF()">+ Template</button><button class="btn g" onclick="recApply()">Terapkan ke '+bln(M)+'</button>':''}<button class="btn g" onclick="closeM()">Tutup</button></div>`)}
function recF(id){const r=S.rec.find(x=>x.id==id)||{type:'out',cat:S.cats.out[0],amt:0,note:''};form('Template Berulang',[{k:'tc',l:'Jenis dan kategori',t:'select',o:[...S.cats.in.map(c=>['in|'+c,'Pendapatan - '+c]),...S.cats.out.map(c=>['out|'+c,'Pengeluaran - '+c])],v:r.type+'|'+r.cat},{k:'amt',l:'Jumlah (Rp)',t:'money',v:r.amt},{k:'note',l:'Keterangan',v:r.note}],d=>{if(!d.amt)return false;const p=d.tc.split('|'),v={type:p[0],cat:p.slice(1).join('|'),amt:d.amt,note:d.note};if(id)Object.assign(r,v);else S.rec.push({id:uid(),...v});setTimeout(recM,80)})}

function fTx(){return S.tx.filter(t=>{const rg=(F.from||F.to)?((!F.from||t.date>=F.from)&&(!F.to||t.date<=F.to)):t.date.slice(0,7)==M;return rg&&(!F.type||t.type==F.type)&&(!F.cat||t.cat==F.cat)&&(!F.q||(t.cat+' '+(t.note||'')+' '+t.amt).toLowerCase().indexOf(F.q.toLowerCase())>-1)}).sort((a,b)=>b.date.localeCompare(a.date))}
function txList(){const L=fTx(),ti=L.filter(t=>t.type=='in').reduce((a,b)=>a+b.amt,0),to=L.filter(t=>t.type=='out').reduce((a,b)=>a+b.amt,0);
return`<p class=mu>${L.length} data | Pendapatan <b class=g1>${rp(ti)}</b> | Pengeluaran <b class=g2>${rp(to)}</b> ${(F.from||F.to)?'(rentang tanggal)':'('+bln(M)+')'}</p><div class=tw><table><tr><th>Tanggal<th>Jenis<th>Kategori<th class=n>Jumlah<th>Keterangan<th></tr>${L.map(t=>`<tr><td>${t.date}<td class="${t.type=='in'?'g1':'g2'}">${t.type=='in'?'Masuk':'Keluar'}<td>${esc(t.cat)}<td class=n>${rp(t.amt)}<td>${esc(t.note)}<td>${t.ref?'<span class=tag>otomatis dari gaji</span>':ed()&&!(S.locks&&S.locks[t.date.slice(0,7)])?`<button class="btn s" onclick="txF('${t.type}','${t.id}')">Ubah</button><button class="btn s r" onclick="delTx('${t.id}')">Hapus</button>`:''}</tr>`).join('')||'<tr><td colspan=6 class=mu>Tidak ada data</tr>'}</table></div>`}

const csvEsc=v=>{const s=String(v==null?'':v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function expMenu(name,head,rows){modal(`<h3>Export ${esc(name)}</h3><p class=mu>${rows.length} baris. Pilih format berkas.</p><div class=yn><button class=btn id=xc>CSV</button><button class=btn id=xx>Excel (.xls)</button></div><button class="btn g" style="width:100%;margin-top:10px" onclick="closeM()">Batal</button>`);
const go=async f=>{try{let file;const all=[head].concat(rows);if(f=='csv')file=new File(['\ufeff'+all.map(r=>r.map(csvEsc).join(';')).join('\r\n')],name+'.csv',{type:'text/csv'});else{const x=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),cell=v=>typeof v=='number'?'<Cell><Data ss:Type="Number">'+v+'</Data></Cell>':'<Cell><Data ss:Type="String">'+x(v)+'</Data></Cell>';file=new File(['<'+'?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Data"><Table>'+all.map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('')+'</Table></Worksheet></Workbook>'],name+'.xls',{type:'application/vnd.ms-excel'})}
if(!await secure('mengekspor',file,'Penyimpanan perangkat'))return;const r=await fa_save(file);if(r){closeM();toast('Berkas '+r)}}catch(e){toast('Export gagal: '+(e&&e.message||e))}};
$('#xc').onclick=()=>go('csv');$('#xx').onclick=()=>go('xls')}

function capF(){const o=[['all','Semua (dibagi sesuai modal awal)'],...S.inv.map(v=>[v.id,v.name+' saja'])];form('Tambah Modal',[{k:'amt',l:'Jumlah (Rp)',t:'money'},{k:'who',l:'Dari',t:'select',o,v:'all'},{k:'month',l:'Berlaku mulai bulan',t:'month',v:nextM(M)},{k:'note',l:'Keterangan'}],d=>{if(!d.amt)return false;const dt=today();if(d.who=='all'){const T=S.inv.reduce((a,b)=>a+b.cap,0);S.inv.forEach(v=>S.adds.push({id:uid(),date:dt,month:d.month,inv:v.id,amt:Math.round(d.amt*v.cap/T),note:(d.note||'')+' (pembagian '+(v.cap/T*100).toFixed(1)+'%)'}))}else S.adds.push({id:uid(),date:dt,month:d.month,inv:d.who,amt:d.amt,note:d.note})})}
function invF(id){const v=S.inv.find(x=>x.id==id)||{name:'',cap:0};form('Pemodal',[{k:'name',l:'Nama',v:v.name},{k:'cap',l:'Modal Awal',t:'money',v:v.cap}],d=>{if(!d.name)return false;if(id)Object.assign(v,d);else S.inv.push({id:uid(),...d})})}
function kasF(){form('Catat Kas',[{k:'inv',l:'Pemodal',t:'select',o:S.inv.map(v=>[v.id,v.name])},{k:'month',l:'Untuk bulan',t:'month',v:M},{k:'kind',l:'Status',t:'select',o:[['take','Diambil (sebagian/semua, mengurangi total kas)'],['keep','Tidak diambil (menambah total kas, tidak menambah modal)']]},{k:'amt',l:'Jumlah',t:'money'},{k:'date',l:'Tanggal',t:'date',v:today()},{k:'note',l:'Keterangan'}],d=>{if(!d.amt)return false;if(d.kind=='take'){const sl=kasSaldo(d.inv);if(d.amt>sl){toast('Melebihi total kas ('+rp(sl)+'). Catat dulu bagian laba sebagai Tidak diambil.');return false}}S.kas.push({id:uid(),...d,take:d.kind=='take'})})}
const kasSaldo=id=>S.kas.filter(k=>k.inv==id).reduce((a,k)=>{const q=k.kind||(k.take?'take':'keep');return a+(q=='keep'?k.amt:-k.amt)},0);
function kasQ(id,amt,kind){if(!ed())return;S.kas.push({id:uid(),inv:id,month:M,kind,take:kind=='take',amt,date:today(),note:kind=='keep'?'Tidak diambil, masuk saldo kas':'Diambil',});save();R();toast('Tercatat')}

const hf=f=>{if(!f)return;const r=new FileReader();r.onerror=()=>toast('File tidak dapat dibaca');r.onload=()=>{const i=new Image();i.onerror=()=>toast('File bukan gambar yang valid');i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,200/Math.max(i.width,i.height));c.width=Math.max(1,i.width*k);c.height=Math.max(1,i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);setLogo(c.toDataURL('image/png'))};i.src=r.result};r.readAsDataURL(f)};$('#lgf').onchange=e=>hf(e.target.files[0]);$('#lgb').onclick=async()=>{try{hf(await fa_open([{description:'Gambar',accept:{'image/*':['.png','.jpg','.jpeg','.webp','.gif']}}],'image/*'))}catch(e){toast(e.message)}};const dz=$('#lgp');dz.ondragover=e=>e.preventDefault();dz.ondrop=e=>{e.preventDefault();hf(e.dataTransfer.files[0])};document.onpaste=e=>{if(!$('#lgf'))return;const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.startsWith('image/'));if(it)hf(it.getAsFile())}}
